<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Family Feud — Game Screen</title>
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/common.css">
  <link rel="stylesheet" href="/css/game-screen.css">
</head>
<body>

  <div class="game-screen" id="game-stage">
    <!-- Studio backdrop (changes with the camera shot) -->
    <div class="gs-backdrop" id="gs-backdrop"></div>

    <!-- Scoreboard bar -->
    <div class="gs-scoreboard">
      <div class="gs-team gs-team1">
        <div class="gs-team-name" id="gs-team1-name">Team 1</div>
        <div class="gs-team-score" id="gs-team1-score">0</div>
      </div>
      <div class="gs-round-indicator" id="gs-round">
        <span class="gs-round-text">FAMILY FEUD</span>
      </div>
      <div class="gs-team gs-team2">
        <div class="gs-team-name" id="gs-team2-name">Team 2</div>
        <div class="gs-team-score" id="gs-team2-score">0</div>
      </div>
    </div>

    <!-- Main stage area -->
    <div class="gs-stage">
      <!-- Waiting / lobby state -->
      <div class="gs-waiting" id="gs-waiting">
        <div class="logo-stars">&#9733; &#9733; &#9733;</div>
        <h1 class="ff-logo">Family Feud</h1>
        <p class="ff-logo-sub">Game Night Edition</p>
        <p class="mt-3" style="color:var(--ff-gray)">Waiting for the host to start the game...</p>
        <p class="mt-2" id="gs-audio-hint" style="color:var(--ff-gray); font-size:0.8rem; opacity:0.7">Click anywhere to enable sound</p>
      </div>

      <!-- Current question -->
      <div class="gs-question hidden" id="gs-question"></div>

      <!-- Face-off status -->
      <div class="gs-faceoff hidden" id="gs-faceoff"></div>

      <!-- GIANT buzz-in indicator -->
      <div class="gs-buzzin hidden" id="gs-buzzin"></div>

      <!-- Answer board (hidden until a question is in play) -->
      <div class="gs-board hidden" id="gs-board">
        <div class="rb-total" id="rb-total"></div>
        <div class="rb-slots" id="rb-slots"></div>
      </div>

      <!-- Round bank (running total) -->
      <div class="gs-bank-wrap hidden" id="gs-bank-wrap">
        <span class="gs-bank-label">Round Total</span>
        <span class="gs-bank" id="gs-bank">0</span>
      </div>

      <!-- Strike overlay -->
      <div class="gs-strikes" id="gs-strikes" aria-hidden="true"></div>

      <!-- Round-end / game-over overlay -->
      <div class="gs-overlay hidden" id="gs-overlay">
        <div class="gs-overlay-content" id="gs-overlay-content"></div>
      </div>

      <!-- Fast Money board (fastmoney-bg.png with answers/scores overlaid) -->
      <div class="gs-fastmoney hidden" id="gs-fastmoney">
        <div class="fmb-name fmb-name-l" id="fmb-name-l"></div>
        <div class="fmb-name fmb-name-r" id="fmb-name-r"></div>
        <div class="fmb-side fmb-left" id="fmb-left"></div>
        <div class="fmb-side fmb-right" id="fmb-right"></div>
        <div class="fmb-total" id="fmb-total"></div>
        <div class="fm-timer-big hidden" id="fm-timer-big">20</div>
        <div class="fm-status" id="fm-status"></div>
      </div>
    </div>

    <!-- Play shot: team name + roster, in the FULL-SCREEN layer so positions
         map to the studio set image (not the stage, which sits below the bar) -->
    <div class="gs-play-overlay" id="gs-play-overlay" aria-hidden="true">
      <div class="gs-play-team" id="gs-play-team"></div>
      <div class="gs-play-roster" id="gs-play-roster"></div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/socket-client.js"></script>
  <script src="/js/sounds.js"></script>
  <script src="/js/game-screen.js"></script>
</body>
</html>
